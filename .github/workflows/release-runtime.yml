name: Release node runtime (upstream tree)

# Pack the **upstream release** for one DSH version, per platform, on CI rather than on
# somebody's laptop.
#
# **This is not the route a node takes.** Nodes download the tree this project builds from its
# own fork (`build-fork-runtime.mjs`, see `docs/adr-0007-fork-node-runtime.zh.md`), and there is
# no node-side fallback any more. What this workflow still buys is the upstream tree itself, as
# a comparison point and as the thing `verify-packed-install` can check without a fork
# checkout: it answers "does the release we pinned to still pack cleanly?".
#
# Measured on the reference node (Linux x86_64, glibc 2.35, Node v22.20.0): the upstream tree is
# a 165 MiB download; the fork build is 58.2 MiB and 25 167 files (build 7), because it drops the
# browser surface, the Office engine and the experimental bundles, then strips the bytes inside
# the remaining packages that no runtime reads.
#
# The matrix packs natively. `publish-runtime.mjs` resolves **for the target platform** with
# `--os/--cpu/--libc` and `--ignore-scripts`, so running it on the matching runner is not what
# makes the natives correct — it is what lets `tar` record the executable bit, which a Windows
# packer cannot (measured: every entry comes out `-rw-rw-rw-`).
#
# The build and the upload are separate jobs on purpose: four matrix legs uploading into one
# release would race on `gh release create`, and a failure there would look like a packaging
# bug. The legs only produce artifacts; one job publishes all of them.
#
# **Uploading here overwrites the fork archive at the same tag.** A node reads
# `v<version>/dsh-<version>-<platform>.tar.gz` from CNB, so publishing an upstream tree into that
# path would replace what every node downloads with a 165 MiB tree that has none of the trimming.
# Keep `publish` off unless you mean to replace it, and re-run the fork build afterwards.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream DSH version to pack, e.g. 0.2.2-rc.5'
        required: true
        type: string
      publish:
        description: 'Upload to the v<version>-upstream comparison tag (otherwise only build artifacts)'
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [upstream-dsh-release]

permissions:
  contents: write

jobs:
  pack:
    name: Pack ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not discard the archives the others already built: a node
      # on any platform that succeeded can then take the fast path.
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          # `macos-14` is **retired**, and the failure it produces does not say so: the job is
          # cancelled in 0s with "The configuration 'macos-14-arm64-us-default' is not
          # supported", which reads like a label typo. Measured 2026-11-21 (run 44908940637):
          # `macos-14` fails, `macos-15` and `macos-latest` both come up as arm64, `macos-13`
          # queues forever. `macos-15` is pinned rather than `macos-latest` so a future image
          # roll does not silently change what an archive was built on.
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The packer only needs a modern Node to run npm; the archive's own Node floor is
          # the upstream `engines` field, which the node checks (and is told about) itself.
          node-version: '24'

      - name: Resolve the version to pack
        id: wanted
        shell: bash
        run: |
          set -eu
          version="${{ github.event.inputs.version || github.event.client_payload.version }}"
          if [ -z "$version" ]; then
            echo "::error::no version given — pass one in workflow_dispatch or in the dispatch payload"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack the runtime for this platform
        shell: bash
        # `--registry` is what the *packer* can reach. The node later uses whichever registry
        # it is configured with, and the npm route uses the node's own.
        #
        # `--out` is resolved **against the plugin package root**, not the repository root:
        # `publish-runtime.mjs` does `resolve(pluginRoot, value('out'))`. A bare `dist` therefore
        # wrote to `packages/dsh-remote-node-harness/dist/`, while the artifact step below uploads
        # `dist/dsh-*.tar.gz` from the repository root with `if-no-files-found: error` — a run
        # would have packed four platforms and then failed to collect any of them. An absolute
        # path removes the ambiguity instead of relying on the reader knowing that base.
        run: |
          node packages/dsh-remote-node-harness/scripts/publish-runtime.mjs \
            --version "${{ steps.wanted.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --out "${GITHUB_WORKSPACE}/dist" \
            --registry https://registry.npmmirror.com

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            dist/dsh-*.tar.gz
            dist/dsh-*.tar.gz.sha256
          # The archives are 127-192 MiB each (measured build rc.5: linux-x64 127.4, linux-arm64
          # 130.1, darwin-arm64 191.6, win32-x64 191.1); this is the whole point of the job.
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to a comparison tag
    needs: pack
    if: ${{ github.event_name == 'repository_dispatch' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: wanted
        shell: bash
        run: |
          set -eu
          version="${{ github.event.inputs.version || github.event.client_payload.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect every platform's archive
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          # `gh` reads this; `contents: write` is what makes the upload legal.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # **The tag carries `-upstream` on purpose.** The node release is `v<version>`, and its
        # assets are the fork build; uploading an upstream tree into that tag with `--clobber`
        # would replace the backup with a runtime no node should run, under the same name and
        # version. A separate tag keeps both, and makes "which one is this" answerable from the
        # URL alone.
        run: |
          set -eu
          version="${{ steps.wanted.outputs.version }}"
          tag="v${version}-upstream"
          ls -l dist
          gh release create "$tag" \
            --title "DSH ${version} upstream runtime (comparison)" \
            --notes "The **upstream** tree for DSH ${version}, one archive per platform. This is
          not what a node runs: nodes download the fork build published at \`v${version}\`
          (\`build-fork-runtime.mjs\`), which drops the browser surface, the Office engine and the
          experimental bundles. Kept for comparison and for \`verify-packed-install\`.
          Verified by sha256 next to each archive." \
            || echo "release ${tag} already exists; uploading into it"
          gh release upload "$tag" dist/dsh-*.tar.gz dist/dsh-*.tar.gz.sha256 --clobber

  # There used to be a `cnb` job here that uploaded these archives to the CNB release. It is
  # **removed**, not disabled: CNB is the one place a node downloads from, and the path is
  # `v<version>/dsh-<version>-<platform>.tar.gz` — the same path the fork build publishes to.
  # An upstream tree landing there would replace what every node downloads with a 165 MiB tree
  # that has none of the trimming, and nothing in the download would notice: same name, same
  # version, valid checksum, different runtime. `build-fork-runtime.mjs --cnb` is the only
  # thing that may write to that path.

  # One summary job, so a person reading the run knows what this produced without opening four
  # logs — and so the note that this is not the node route is impossible to miss.
  summary:
    needs: pack
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          set -eu
          result="${{ needs.pack.result }}"
          echo "pack: $result"
          echo "::notice::these are upstream trees, for comparison and for verify-packed-install; nodes run the fork build (build-fork-runtime.mjs)"
          if [ "$result" != "success" ]; then
            echo "::warning::some platforms did not pack — that says nothing about what nodes can install, because nodes do not take this route"
          fi
