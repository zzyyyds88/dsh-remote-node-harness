name: Pack the upstream tree (comparison)

# Answers one question: **does the upstream release we pinned to still pack cleanly, on every
# platform, from a machine that is not this laptop?** It packs the official `@deepseek-ai/dsh`
# tree for each platform and keeps the archives as CI artifacts for a week.
#
# **It does not publish anything, and it is not the route a node takes.** Nodes download the tree
# this project builds from its own fork (`build-fork-runtime.mjs`, see
# `docs/adr-0007-fork-node-runtime.zh.md`), and there is no node-side fallback any more. The
# `v<version>-upstream` comparison release this workflow used to create is **gone** (2026-11-21):
# four archives of 127-192 MiB each, ~640 MiB per run, and nothing consumed them —
# `verify-packed-install` reads a directory of `.tgz` tarballs, not these `.tar.gz` trees, and no
# script in this repository or the fork downloads the tag. Keeping the pack step keeps the
# smoke signal; dropping the publish step drops 640 MiB of assets per upstream version that
# nothing read.
#
# Measured on the reference node (Linux x86_64, glibc 2.35, Node v22.20.0): the upstream tree is
# a 165 MiB download; the fork build is 58.2 MiB and 25 167 files (build 7), because it drops the
# browser surface, the Office engine and the experimental bundles, then strips the bytes inside
# the remaining packages that no runtime reads.
#
# The matrix packs natively. `publish-runtime.mjs` resolves **for the target platform** with
# `--os/--cpu/--libc` and `--ignore-scripts`, so running it on the matching runner is not what
# makes the natives correct — it is what lets `tar` record the executable bit, which a Windows
# packer cannot (measured: every entry comes out `-rw-rw-rw-`).
#
# **The tar invocation matters here.** These legs run under `shell: bash`, so on Windows the
# `tar` on PATH is Git Bash's GNU tar, which reads an absolute `D:\...` argv entry as a remote
# host. Both scripts pack with a relative `-C` and `cwd` for that reason; run 44902426318 is the
# failure that established it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream DSH version to pack, e.g. 0.2.2-rc.5'
        required: true
        type: string
  repository_dispatch:
    types: [upstream-dsh-release]

permissions:
  contents: read

jobs:
  pack:
    name: Pack ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not discard the archives the others already built: a broken
      # darwin image and a broken tarball look the same from a single red X otherwise.
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          # `macos-14` is **retired**, and the failure it produces does not say so: the job is
          # cancelled in 0s with "The configuration 'macos-14-arm64-us-default' is not
          # supported", which reads like a label typo. Measured 2026-11-21 (run 44908940637):
          # `macos-14` fails, `macos-15` and `macos-latest` both come up as arm64, `macos-13`
          # queues forever. `macos-15` is pinned rather than `macos-latest` so a future image
          # roll does not silently change what an archive was built on.
          - platform: darwin-arm64
            runner: macos-15
          - platform: win32-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The packer only needs a modern Node to run npm; the archive's own Node floor is
          # the upstream `engines` field, which the node checks (and is told about) itself.
          node-version: '24'

      - name: Resolve the version to pack
        id: wanted
        shell: bash
        run: |
          set -eu
          version="${{ github.event.inputs.version || github.event.client_payload.version }}"
          if [ -z "$version" ]; then
            echo "::error::no version given — pass one in workflow_dispatch or in the dispatch payload"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack the runtime for this platform
        shell: bash
        # `--registry` is what the *packer* can reach. The node later uses whichever registry
        # it is configured with, and the npm route uses the node's own.
        #
        # `--out` is resolved **against the plugin package root**, not the repository root:
        # `publish-runtime.mjs` does `resolve(pluginRoot, value('out'))`. A bare `dist` therefore
        # wrote to `packages/dsh-remote-node-harness/dist/`, while the artifact step below uploads
        # `dist/dsh-*.tar.gz` from the repository root with `if-no-files-found: error` — a run
        # would have packed four platforms and then failed to collect any of them. An absolute
        # path removes the ambiguity instead of relying on the reader knowing that base.
        run: |
          node packages/dsh-remote-node-harness/scripts/publish-runtime.mjs \
            --version "${{ steps.wanted.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --out "${GITHUB_WORKSPACE}/dist" \
            --registry https://registry.npmmirror.com

      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            dist/dsh-*.tar.gz
            dist/dsh-*.tar.gz.sha256
          # The archives are 127-192 MiB each (measured build rc.5: linux-x64 127.4, linux-arm64
          # 130.1, darwin-arm64 191.6, win32-x64 191.1); this is the whole point of the job.
          retention-days: 7
          if-no-files-found: error

  # There used to be a `publish` job here, creating `v<version>-upstream` with all four archives.
  # It is **removed**, not disabled: nothing downloaded it. `verify-packed-install` reads a
  # directory of `.tgz` tarballs, and no script here or in the fork fetches the tag — so each
  # upstream version left ~640 MiB of assets on the public repo that only a human ever opened.
  #
  # There also used to be a `cnb` job that is **still** correctly absent: CNB is the one place a
  # node downloads from, at `v<version>/dsh-<version>-<platform>.tar.gz`, the same path the fork
  # build publishes to. An upstream tree landing there would replace what every node downloads
  # with a 165 MiB untrimmed tree under an identical name and version.

  # One summary job, so a person reading the run knows what this produced without opening four
  # logs — and so the note that this is not the node route is impossible to miss.
  summary:
    needs: pack
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          set -eu
          result="${{ needs.pack.result }}"
          echo "pack: $result"
          echo "::notice::these are upstream trees kept as artifacts, not releases; nodes run the fork build (build-fork-runtime.mjs)"
          if [ "$result" != "success" ]; then
            echo "::warning::some platforms did not pack — that says nothing about what nodes can install, because nodes do not take this route"
          fi