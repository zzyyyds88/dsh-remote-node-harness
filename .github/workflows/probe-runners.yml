name: Probe runner labels

# Throwaway: answers "which macOS runner label can this repository actually get?".
# `release-runtime.yml` failed on `macos-14` with
#   The configuration 'macos-14-arm64-us-default' is not supported
# which is not a label typo — it names an internal runner configuration. This job tries the
# plausible labels side by side so the answer is measured instead of guessed. Deleted after use.

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-latest, macos-13, ubuntu-latest]
    steps:
      - name: Report what we got
        shell: bash
        run: |
          echo "runner=${{ matrix.runner }}"
          uname -a
          uname -m
          node --version
